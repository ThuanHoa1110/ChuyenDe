name: Continuous Integration (CI)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Pip Packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black

      - name: Check Python Syntax & Compilation
        run: |
          python -m compileall src/ tests/

      - name: Run Flake8 Linter
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treat all errors as warnings
          flake8 src/ tests/ --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

  test:
    name: Unit & Integration Tests (CPU)
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache Pip Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-test-${{ matrix.python-version }}-

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: Verify Offline Determinism
        run: |
          python -c "import torch; print(f'PyTorch: {torch.__version__} | CUDA available: {torch.cuda.is_available()}')"
          python -c "import fastapi, pydantic; print(f'FastAPI: {fastapi.__version__} | Pydantic: {pydantic.__version__}')"

      - name: Run Full Pytest Test Suite
        env:
          PYTHONPATH: .
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_OFFLINE: "1"
        run: |
          pytest tests/ -v --durations=10

  docker-dry-run:
    name: Docker Build Validation (No Push)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: hanoi-temperature:test-dry-run
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Image Security & Non-Root User
        run: |
          docker build -t hanoi-temperature:test-local .
          USER_NAME=$(docker run --rm hanoi-temperature:test-local whoami)
          echo "Container runtime user: $USER_NAME"
          if [ "$USER_NAME" != "appuser" ]; then
            echo "ERROR: Container is not running as non-root appuser!"
            exit 1
          fi
