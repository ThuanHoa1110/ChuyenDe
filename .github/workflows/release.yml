name: Continuous Deployment (CD Release)

"on":
  push:
    tags:
      - "v*.*.*"
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image version tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

# Enforce least-privilege security permissions
permissions:
  contents: read

jobs:
  pre-release-test:
    name: Pre-Release Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Pip Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-release-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-release-

      - name: Install Dependencies (CPU)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: Run Test Suite Verification
        env:
          PYTHONPATH: .
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_OFFLINE: "1"
        run: |
          python -m pytest tests/ -v

  build-and-push:
    name: Build & Push Docker Hub Release
    runs-on: ubuntu-latest
    needs: [pre-release-test]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Verify Docker Hub Secrets
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DH_USER" ] || [ -z "$DH_TOKEN" ]; then
            echo "::error::Missing GitHub Secrets DOCKERHUB_USERNAME or DOCKERHUB_TOKEN. Add them in Repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve Target Image Tags
        id: resolve
        run: |
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/hanoi-temperature"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ inputs.tag }}"
          else
            VER="${{ github.ref_name }}"
          fi
          echo "repo=$REPO" >> $GITHUB_OUTPUT
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "tags=${REPO}:${VER},${REPO}:latest" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.resolve.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate GitHub Release Step Summary
        run: |
          echo "## Docker Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Repository:** \`${{ steps.resolve.outputs.repo }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Version Tag:** \`${{ steps.resolve.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Docker Image Digest:** \`${{ steps.docker_build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Pushed Tags:** \`${{ steps.resolve.outputs.tags }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Rollback Command" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ steps.resolve.outputs.repo }}@${{ steps.docker_build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
